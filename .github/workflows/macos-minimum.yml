name: Runs on macOS 12

# Monterey gets the same build as every other Mac, and hosted CI has no Monterey machine. An update to
# Avalonia, SkiaSharp or .NET that drops macOS 12 would pass every test and then refuse to open there,
# so this publishes the Mac build and checks the minimum macOS version each program and library
# records. The nightly run catches a new .NET patch, which reaches the build without any commit.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Mac files load on macOS 12
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the desktop app for Intel and Apple Silicon
        run: |
          for rid in osx-x64 osx-arm64; do
            dotnet publish src/Purity.Desktop/Purity.Desktop.csproj -c Release -r "$rid" --self-contained -o "out/macos/$rid"
          done

      - name: Check
        run: dotnet run tools/check-macos-minimum.cs -- out/macos 12.0
