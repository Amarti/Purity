name: Calculation parity

# Proves the engine gives exactly the same dates on every platform. The repo is public, so logs and
# artifacts must never contain real dates: real-data tests report positions only, and this workflow
# uploads nothing.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: ${{ matrix.os }} ${{ matrix.tz }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        tz: [UTC]
        include:
          - { os: ubuntu-24.04, tz: Asia/Jerusalem }
          - { os: ubuntu-24.04, tz: America/Los_Angeles }
          - { os: ubuntu-24.04, tz: Pacific/Kiritimati }
          - { os: ubuntu-24.04, tz: Pacific/Pago_Pago }
          - { os: ubuntu-24.04, tz: Asia/Kathmandu }
          - { os: macos-latest, tz: Asia/Jerusalem }
    env:
      TZ: ${{ matrix.tz }}
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/Purity.Parity/Purity.Parity.csproj -c Release

      - name: Build storage tests
        run: dotnet build tests/Purity.Storage.Tests/Purity.Storage.Tests.csproj -c Release

      - name: Build desktop app tests
        run: dotnet build tests/Purity.Desktop.Tests/Purity.Desktop.Tests.csproj -c Release

      # After the build, so the plain data isn't on disk during package restore. Forks and fork
      # pull requests have no secret and skip this; here a missing secret must fail, not skip.
      - name: Decrypt real data
        id: fixture
        if: ${{ github.repository == 'Amarti/Purity' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          PURITY_FIXTURE_PASSPHRASE: ${{ secrets.PURITY_FIXTURE_PASSPHRASE }}
        run: |
          if [ ! -f tests/fixtures/private.tar.gz.gpg ]; then
            echo "Encrypted fixture isn't committed yet: real-data tests will skip"
            exit 0
          fi
          if [ -z "$PURITY_FIXTURE_PASSPHRASE" ]; then
            echo "::error::The encrypted fixture is committed but the PURITY_FIXTURE_PASSPHRASE secret is missing"
            exit 1
          fi
          bash tools/fixture.sh decrypt
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Test on .NET 10
        shell: bash
        env:
          PURITY_REQUIRE_REAL_DATA: ${{ steps.fixture.outputs.available == 'true' && '1' || '0' }}
        run: dotnet run --no-build -c Release --project tests/Purity.Parity/Purity.Parity.csproj

      - name: Test storage on .NET 10
        shell: bash
        timeout-minutes: 15
        env:
          PURITY_REQUIRE_REAL_DATA: ${{ steps.fixture.outputs.available == 'true' && '1' || '0' }}
        run: dotnet run --no-build -c Release --project tests/Purity.Storage.Tests/Purity.Storage.Tests.csproj

      - name: Test the desktop app
        shell: bash
        timeout-minutes: 10
        run: dotnet run --no-build -c Release --project tests/Purity.Desktop.Tests/Purity.Desktop.Tests.csproj

      - name: Remove decrypted data
        if: always()
        shell: bash
        run: rm -rf tests/private

  debian:
    name: debian 13
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test on .NET 10
        run: dotnet run -c Release --project tests/Purity.Parity/Purity.Parity.csproj

  no-os-culture:
    name: no OS culture data
    runs-on: ubuntu-24.04
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test on .NET 10
        run: dotnet run -c Release --project tests/Purity.Parity/Purity.Parity.csproj

  nls:
    name: windows NLS
    runs-on: windows-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_USENLS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test on .NET 10
        run: dotnet run -c Release --project tests/Purity.Parity/Purity.Parity.csproj

  golden-guard:
    name: approved output changes need a rules bump
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check
        shell: bash
        # Only changed, renamed or removed approved files count: a new one adds a check without
        # changing any approved date
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only --diff-filter=MDR "$base" HEAD | grep -q '^tests/Purity.Parity/Golden/'; then
            git diff "$base" HEAD -- src/Purity.Core/PeriodLedger.cs | grep -q '^+.*RulesVersion = ' || {
              echo "Approved output changed without bumping PeriodLedger.RulesVersion"
              exit 1
            }
          fi
